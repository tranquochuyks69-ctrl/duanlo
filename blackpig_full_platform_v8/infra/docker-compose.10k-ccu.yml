version: '3.9'
# ==============================================================================
# BLACKPIG (黑猪学中文) — 10,000 CCU PRODUCTION INFRASTRUCTURE (HARDENED v8)
# Fixes applied:
# 1. Nginx mounts ONLY ../dist/public (static build output), NEVER project root
# 2. Full TLS 1.2/1.3 termination on port 443 + HTTP->HTTPS 301 redirect
# 3. PostgreSQL synchronous_commit=on + WAL archiving + pg_stat_statements + pg_partman
# 4. Dedicated pgBackRest WAL backup sidecar + Streaming Read Replica
# 5. Docker Secrets instead of plaintext credentials
# 6. FastAPI AI & Speech Worker (ai_speech_service:app) + Sentry/Prometheus metrics
# ==============================================================================

secrets:
  db_app_password:
    file: ./secrets/db_app_password.txt
  db_owner_password:
    file: ./secrets/db_owner_password.txt
  jwt_hmac_secret:
    file: ./secrets/jwt_hmac_secret.txt
  llm_api_key:
    file: ./secrets/llm_api_key.txt

services:
  nginx-lb:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../dist/public:/usr/share/nginx/html:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - api-gateway
    restart: unless-stopped

  api-gateway:
    image: node:20-alpine
    working_dir: /app
    command: node dist/backend/server_10k_ccu.js
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    secrets:
      - db_app_password
      - jwt_hmac_secret
    environment:
      - NODE_ENV=production
      - DATABASE_URL_FILE=/run/secrets/db_app_password
      - PGBOUNCER_HOST=pgbouncer
      - PGBOUNCER_PORT=6432
      - DB_READ_REPLICA_HOST=postgres-replica
      - REDIS_URL=redis://redis-cluster:6379
      - AI_WORKER_URL=http://ai-speech-worker:8000
      - SENTRY_DSN=${SENTRY_DSN:-}
      - CLUSTER_WORKERS=4
    depends_on:
      - pgbouncer
      - redis-cluster
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:1.22.0
    secrets:
      - db_app_password
    environment:
      - DB_USER=blackpig_app
      - DB_PASSWORD_FILE=/run/secrets/db_app_password
      - DB_HOST=postgres-primary
      - DB_NAME=blackpig_prod
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=12000
      - DEFAULT_POOL_SIZE=120
      - MIN_POOL_SIZE=25
      - RESERVE_POOL_SIZE=30
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "6432:5432"
    depends_on:
      - postgres-primary
    restart: unless-stopped

  postgres-primary:
    image: postgres:16-alpine
    secrets:
      - db_owner_password
      - db_app_password
    environment:
      - POSTGRES_USER=blackpig_owner
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_owner_password
      - POSTGRES_DB=blackpig_prod
    command: >
      postgres
      -c max_connections=350
      -c shared_buffers=4GB
      -c effective_cache_size=12GB
      -c work_mem=16MB
      -c maintenance_work_mem=512MB
      -c synchronous_commit=on
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='pgbackrest --stanza=blackpig archive-push %p'
      -c max_wal_senders=10
      -c wal_keep_size=2GB
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c shared_preload_libraries='pg_stat_statements'
      -c pg_stat_statements.track=all
    volumes:
      - ../migrations:/docker-entrypoint-initdb.d:ro
      - pg_primary_data:/var/lib/postgresql/data
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/var/lib/pgbackrest
    restart: unless-stopped

  postgres-replica:
    image: postgres:16-alpine
    secrets:
      - db_owner_password
    environment:
      - PGUSER=blackpig_owner
      - PGPASSWORD_FILE=/run/secrets/db_owner_password
    command: >
      postgres
      -c hot_standby=on
      -c max_connections=350
      -c shared_buffers=4GB
    depends_on:
      - postgres-primary
    restart: unless-stopped

  postgres-backup-wal:
    image: pgbackrest/pgbackrest:latest
    volumes:
      - pg_primary_data:/var/lib/postgresql/data:ro
      - ./pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest_repo:/var/lib/pgbackrest
    depends_on:
      - postgres-primary
    restart: unless-stopped

  redis-cluster:
    image: redis:7.2-alpine
    command: redis-server --maxmemory 4gb --maxmemory-policy volatile-lru --save "900 1" --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    restart: unless-stopped

  ai-speech-worker:
    image: python:3.11-slim
    working_dir: /app
    command: uvicorn ai_speech_service:app --host 0.0.0.0 --port 8000 --workers 4
    secrets:
      - llm_api_key
      - db_app_password
    environment:
      - DATABASE_URL_FILE=/run/secrets/db_app_password
      - LLM_API_KEY_FILE=/run/secrets/llm_api_key
      - SENTRY_DSN=${SENTRY_DSN:-}
    deploy:
      replicas: 2
    restart: unless-stopped

volumes:
  pg_primary_data:
  pgbackrest_repo:
