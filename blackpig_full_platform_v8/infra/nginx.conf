worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;
    keepalive_timeout 65;
    keepalive_requests 10000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/wasm;

    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    upstream blackpig_api_cluster {
        least_conn;
        server api-gateway:3000 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    # Redirect all plain HTTP traffic to HTTPS
    server {
        listen 80 reuseport;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Hardened HTTPS Server (TLS 1.2 / 1.3 + Isolated Static Root)
    server {
        listen 443 ssl http2 reuseport;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static webroot contains ONLY compiled frontend assets (../dist/public)
        root /usr/share/nginx/html;
        index index.html;

        # Strictly block dotfiles and any accidental internal path probes
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
        location ~* ^/(backend|infra|migrations|tests|node_modules|secrets|package\.json|tsconfig\.json) {
            deny all;
            return 404;
        }

        # Immutable Fingerprinted Static Assets
        location ~* \.(css|js|mjs|jpg|jpeg|png|webp|svg|mp3|woff2|wasm)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Service Worker & HTML must revalidate so users receive updates promptly
        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # SEO Static / SSR Learning Pages (Vocabulary, Hanzi, Grammar, Sitemap)
        location ~ ^/(learn|sitemap\.xml) {
            limit_req zone=api_limit burst=40 nodelay;
            proxy_pass http://blackpig_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://blackpig_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass http://blackpig_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
